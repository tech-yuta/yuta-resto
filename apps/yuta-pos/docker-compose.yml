services:
  pos:
    build:
      context: ../..
      dockerfile: apps/yuta-pos/Dockerfile
      args:
        NEXT_PUBLIC_POS_URL: ${NEXT_PUBLIC_POS_URL:-http://localhost:3003}
    ports:
      - '${POS_PORT:-3003}:3000'
    environment:
      SITE_AGENT_URL: ${SITE_AGENT_URL}
      NEXT_PUBLIC_POS_URL: ${NEXT_PUBLIC_POS_URL:-http://localhost:3003}
    networks:
      - local
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

networks:
  local:
    name: ${LOCAL_NETWORK:-yuta_local}
    external: true
