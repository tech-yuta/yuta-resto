# Development only — starts PostgreSQL locally for yuta-display.
# The Next.js app runs with `pnpm dev:display`, not inside Docker.
#
# Usage:
#   docker compose -f apps/yuta-display/docker-compose.dev.yml up -d
#   docker compose -f apps/yuta-display/docker-compose.dev.yml down
services:
  display-db:
    image: postgres:17-alpine
    container_name: yuta-display-db-dev
    environment:
      POSTGRES_USER: yuta_display
      POSTGRES_PASSWORD: yuta_display
      POSTGRES_DB: yuta_display
    ports:
      - '${DISPLAY_DEV_DB_PORT:-55433}:5432'
    volumes:
      - display-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yuta_display -d yuta_display']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  display-db-data:
    name: yuta-display-db-dev-data
