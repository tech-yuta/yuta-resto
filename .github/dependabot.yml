version: 2

# The npm ecosystem is intentionally omitted until GitHub Dependabot supports
# the repository's pnpm 11 lockfile. Dependency alerts remain useful meanwhile.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(actions)
    labels:
      - dependencies
