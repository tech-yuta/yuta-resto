name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  CI: true
  PNPM_VERSION: 11.8.0
  NODE_VERSION: 24.17.0

jobs:
  architecture-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation consistency
        run: pnpm docs:check

      - name: Check formatting
        run: pnpm format:check

      - name: Check architecture boundaries
        run: pnpm architecture:check

      - name: Validate development database topology
        run: |
          docker compose --project-name yuta-cloud-dev --file docker-compose.cloud.dev.yml config --quiet
          docker compose --project-name yuta-pos-dev --file docker-compose.local.dev.yml config --quiet
          docker compose --project-name yuta-display-dev --file apps/yuta-display/docker-compose.dev.yml config --quiet
          pnpm db:reset:dev --dry-run

      - name: Type-check workspaces
        run: pnpm -r --if-present typecheck

  cloud-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cloud and shared tests
        run: pnpm test:cloud

  cloud-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUD_DATABASE_URL: postgres://yuta_ci:yuta_ci@127.0.0.1:5432/yuta_ci
      CLOUD_DATABASE_SSL: 'false'
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      BOOKING_RATE_LIMIT_SECRET: ci-only-booking-rate-limit-secret-32-characters
      PUBLIC_FEEDBACK_IP_HASH_SALT: ci-only-feedback-salt-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_BACKOFFICE_URL: http://localhost:3001
      PUBLIC_BOOKING_BASE_URL: http://localhost:3005

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build cloud applications
        run: pnpm build:cloud

  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local product tests
        run: pnpm test:local
